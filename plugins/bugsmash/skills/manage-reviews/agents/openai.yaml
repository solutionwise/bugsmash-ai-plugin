  short_description: "Manage BugSmash reviews and webhooks"
  default_prompt: "Use $manage-reviews to summarize active BugSmash feedback."
dependencies:
  tools:
    - type: "mcp"
      value: "bugsmash"
      description: "BugSmash projects, versions, comments, folders, replies, and webhooks"
